/* =========================
   OBTÉM O PDF PELA URL
========================= */

function obterPDF() {

  const parametros =
  new URLSearchParams(window.location.search);

  const id =
  parametros.get("id");

  const pdf =
  parametros.get("pdf");

  /*
    ?id=...
    Google Drive através do Worker
  */

  if (id) {

    return {
      url:
        workerURL +
        encodeURIComponent(id),

      download:
        workerURL +
        encodeURIComponent(id),

      tipo:
        "worker"
    };

  }


  /*
    ?pdf=...
    PDF armazenado diretamente no GitHub
  */

  if (pdf) {

    return {
      url:
        pdf,

      download:
        pdf,

      tipo:
        "local"
    };

  }


  /*
    Caso não exista parâmetro,
    abre o PDF padrão.
  */

  return {

    url:
      "UBS CIDADE LUZ PREVIAS.pdf",

    download:
      "UBS CIDADE LUZ PREVIAS.pdf",

      "local"
  };

}


/* =========================
   CARREGAMENTO / TÍTULO
========================= */

function mostrarCarregamento(
  percentual,
  mensagem
) {

  telaCarregamento.classList.remove(
    "oculta"
  );

  atualizarProgresso(
    percentual,
    mensagem
  );
}


function atualizarProgresso(
  percentual,
  mensagem
) {

  const valor =
    Math.max(
      0,
      Math.min(
        100,
        Math.round(percentual)
      )
    );

  carregamentoBarra.style.width =
    valor + "%";

  carregamentoPorcentagem.textContent =
    valor + "%";

  if (mensagem) {
    carregamentoMensagem.textContent =
      mensagem;
  }

}


function ocultarCarregamento() {

  telaCarregamento.classList.add(
    "oculta"
  );

}


function calcularProgressoRenderizacao() {

  if (!totalPaginas) {
    return 55;
  }

  return Math.min(
    99,
    55 +
      Math.round(
        (
          paginasRenderizadas /
          totalPaginas
        ) * 44
      )
  );

}


function extrairIdDriveDaURL() {

  const parametros =
    new URLSearchParams(
      window.location.search
    );

  return parametros.get("id") || "";
}


function extrairNomeArquivoLocal(
  url
) {

  try {

    return decodeURIComponent(
      url
        .split("/")
        .pop()
        .split("?")[0]
    );

  } catch (erro) {

    return "";

  }

}


/*
  Tenta obter o nome real do arquivo pelo
  Content-Disposition enviado pelo Worker.

  Se o Worker expuser esse cabeçalho via CORS,
  conseguimos usar exatamente o mesmo nome
  que aparece no Google Drive.
*/
async function obterNomeArquivoDrive(
  id
) {

  if (!id) {
    return "";
  }

  const url =
    workerURL +
    encodeURIComponent(id);

  /*
    Tentativa 1: HEAD.
  */
  try {

    const resposta =
      await fetch(
        url,
        {
          method: "HEAD",
          credentials: "omit"
        }
      );

    const nome =
      extrairNomeDoContentDisposition(
        resposta.headers.get(
          "content-disposition"
        )
      );

    if (nome) {
      return nome;
    }

  } catch (erro) {
    console.debug(
      "HEAD do Worker não retornou o nome:",
      erro
    );
  }

  /*
    Tentativa 2: requisição pequena por Range.
    Não baixamos o PDF inteiro novamente.
  */
  try {

    const controlador =
      new AbortController();

    const temporizador =
      setTimeout(
        () => controlador.abort(),
        5000
      );

    const resposta =
      await fetch(
        url,
        {
          method: "GET",
          headers: {
            "Range": "bytes=0-0"
          },
          credentials: "omit",
          signal: controlador.signal
        }
      );

    clearTimeout(
      temporizador
    );

    const nome =
      extrairNomeDoContentDisposition(
        resposta.headers.get(
          "content-disposition"
        )
      );

    if (nome) {
      controlador.abort();
      return nome;
    }

    controlador.abort();

  } catch (erro) {
    console.debug(
      "Range do Worker não retornou o nome:",
      erro
    );
  }

  return "";

}


function extrairNomeDoContentDisposition(
  valor
) {

  if (!valor) {
    return "";
  }

  /*
    Prioriza filename*=UTF-8''...
  */
  const utf8 =
    valor.match(
      /filename\*\s*=\s*UTF-8''([^;]+)/i
    );

  if (utf8) {

    try {
      return decodeURIComponent(
        utf8[1].trim()
      );
    } catch (erro) {}
  }

  const simples =
    valor.match(
      /filename\s*=\s*"([^"]+)"/i
    );

  if (simples) {
    return simples[1];
  }

  const simplesSemAspas =
    valor.match(
      /filename\s*=\s*([^;]+)/i
    );

  if (simplesSemAspas) {
    return simplesSemAspas[1].trim();
  }

  return "";
}


function aplicarNomeArquivo(
  nome
) {

  if (!nome) {
    return;
  }

  nomeArquivoAtual =
    String(nome).trim();

  if (!nomeArquivoAtual) {
    return;
  }

  /*
    Remove apenas espaços extras nas pontas.
    O nome do arquivo permanece exatamente como veio.
  */
  document.title =
    nomeArquivoAtual;

  console.log(
    "Título da HQ:",
    nomeArquivoAtual
  );

}


/* =========================
   CARREGAR PDF
========================= */

async function carregarPDF() {

  const dados =
    obterPDF();

  urlPDFAtual =
    dados.url;

  leitor.innerHTML = "";

  paginasRenderizadas = 0;
  totalPaginas = 0;

  mostrarCarregamento(
    0,
    "Estamos preparando as páginas para leitura."
  );

  /*
    O título do arquivo é buscado em paralelo com o PDF.
    Assim essa consulta não acrescenta espera perceptível
    ao carregamento da HQ.
  */
  if (dados.tipo === "worker") {
    obterNomeArquivoDrive(
      extrairIdDriveDaURL()
    ).then(
      nome => {

        if (!nomeArquivoAtual) {
          aplicarNomeArquivo(
            nome
          );
        }

      }
    ).catch(
      () => {}
    );
  } else {
    aplicarNomeArquivo(
      extrairNomeArquivoLocal(dados.url)
    );
  }

  try {

    const loadingTask =
      pdfjsLib.getDocument({
        url: dados.url,
        withCredentials: false
      });

    /*
      Progresso real do download.
      A barra nunca fica em 100% apenas porque o download terminou:
      depois disso ela passa para a etapa de preparação das páginas.
    */
    loadingTask.onProgress = function(progresso) {

      if (
        progresso &&
        progresso.total > 0
      ) {

        const percentualDownload =
          Math.min(
            50,
            Math.round(
              (
                progresso.loaded /
                progresso.total
              ) * 50
            )
          );

        atualizarProgresso(
          percentualDownload,
          "Carregando o arquivo..."
        );

      }

    };

    pdfAtual =
      await loadingTask.promise;

    totalPaginas =
      pdfAtual.numPages;

    /*
      Primeiro tentamos o título gravado nos metadados
      do próprio PDF. Isso evita qualquer requisição
      extra e normalmente corresponde ao nome do arquivo.
    */
    try {

      const metadata =
        await pdfAtual.getMetadata();

      const tituloPDF =
        metadata &&
        metadata.info &&
        metadata.info.Title
          ? String(
              metadata.info.Title
            ).trim()
          : "";

      if (tituloPDF) {
        aplicarNomeArquivo(
          tituloPDF
        );
      }

    } catch (erro) {

      console.debug(
        "Não foi possível ler os metadados do PDF:",
        erro
      );

    }

    console.log(
      "PDF carregado:",
      pdfAtual.numPages,
      "páginas"
    );

    /*
      PRIMEIRA PÁGINA PRIORITÁRIA:
      ela é renderizada imediatamente.
      Assim o usuário começa a ler sem esperar
      todas as outras páginas terminarem.
    */

    atualizarProgresso(
      55,
      "Preparando a primeira página..."
    );

    await renderizarPagina(1);

    paginasRenderizadas = 1;

    atualizarProgresso(
      calcularProgressoRenderizacao(),
      "HQ pronta para leitura."
    );

    /*
      Libera a leitura assim que a primeira página estiver pronta.
    */
    atualizarZoom();

    ocultarCarregamento();

    /*
      As demais páginas continuam sendo renderizadas
      em segundo plano, sem bloquear a leitura.
    */
    renderizarDemaisPaginasEmSegundoPlano();

  } catch (erro) {

    console.error(erro);

    carregamentoMensagem.textContent =
      "Não foi possível carregar a HQ.";

    carregamentoPorcentagem.textContent =
      "";

    leitor.innerHTML = `

      <div style="
        color:white;
        padding:40px;
        max-width:700px;
        margin:auto;
        font-family:Arial;
      ">

        <h2>
          Não foi possível carregar a HQ.
        </h2>

        <p>
          Verifique se o arquivo está disponível
          e se o link do Google Drive está correto.
        </p>

      </div>

    `;

  }

}


/* =========================
   RENDERIZAÇÃO EM SEGUNDO PLANO
========================= */

async function renderizarDemaisPaginasEmSegundoPlano() {

  /*
    Renderiza em pequenos lotes para não travar
    a interface do navegador.
  */

  const tamanhoLote = 3;

  for (
    let inicio = 2;
    inicio <= totalPaginas;
    inicio += tamanhoLote
  ) {

    const fim =
      Math.min(
        inicio + tamanhoLote - 1,
        totalPaginas
      );

    const tarefas = [];

    for (
      let numeroPagina = inicio;
      numeroPagina <= fim;
      numeroPagina++
    ) {

      tarefas.push(
        renderizarPagina(
          numeroPagina
        ).then(
          () => {
            paginasRenderizadas++;

            const progresso =
              calcularProgressoRenderizacao();

            atualizarProgresso(
              progresso,
              "Carregando páginas..."
            );
          }
        )
      );

    }

    await Promise.all(
      tarefas
    );

    /*
      Pequena pausa cooperativa.
      Permite ao navegador responder a
      rolagem, zoom e cliques.
    */
    await new Promise(
      resolver =>
        setTimeout(
          resolver,
          0
        )
    );
  }

  atualizarZoom();

  console.log(
    "Todas as páginas foram renderizadas."
  );

}


/* =========================
   RENDERIZAR PÁGINA
========================= */

async function renderizarPagina(
  numeroPagina
) {

  const pagina =
  await pdfAtual.getPage(
    numeroPagina
  );

  const viewport =
  pagina.getViewport({
    scale: 1
  });

  const canvas =
  document.createElement("canvas");

  const contexto =
  canvas.getContext("2d");

  canvas.width =
  viewport.width;

  canvas.height =
  viewport.height;

  canvas.dataset.originalWidth =
  viewport.width;

  canvas.dataset.originalHeight =
  viewport.height;

  leitor.appendChild(canvas);

  await pagina.render({
    canvasContext: contexto,
    viewport: viewport
  }).promise;

}


/* =========================
   ZOOM
========================= */

function atualizarZoom() {

  zoomTexto.textContent =
    Math.round(zoom * 100) + "%";


  if (
    window.innerWidth <= 700
  ) {

    atualizarZoomMobile();

  } else {

    atualizarZoomDesktop();

  }

}


/* =========================
   ZOOM DESKTOP
========================= */

function atualizarZoomDesktop() {

  const scrollTopAntes =
    areaLeitor.scrollTop;

  const scrollLeftAntes =
    areaLeitor.scrollLeft;

  const larguraAntes =
    leitor.getBoundingClientRect().width;

  const alturaAntes =
    leitor.getBoundingClientRect().height;


  leitor.style.transform =
    `scale(${zoom})`;


  const larguraDepois =
    leitor.getBoundingClientRect().width;

  const alturaDepois =
    leitor.getBoundingClientRect().height;


  /*
    Mantém aproximadamente o ponto
    que estava no centro da tela.
  */

  const centroX =
    scrollLeftAntes +
    areaLeitor.clientWidth / 2;

  const centroY =
    scrollTopAntes +
    areaLeitor.clientHeight / 2;


  if (larguraAntes > 0) {

    const proporcaoX =
      larguraDepois /
      larguraAntes;

    areaLeitor.scrollLeft =
      centroX * proporcaoX -
      areaLeitor.clientWidth / 2;

  }


  if (alturaAntes > 0) {

    const proporcaoY =
      alturaDepois /
      alturaAntes;

    areaLeitor.scrollTop =
      centroY * proporcaoY -
      areaLeitor.clientHeight / 2;

  }


  /*
    Centraliza horizontalmente quando
    a HQ é menor que a área disponível.
  */

  const larguraHQ =
    leitor.scrollWidth *
    zoom;

  const larguraTela =
    areaLeitor.clientWidth;


  if (
    larguraHQ <= larguraTela
  ) {

    areaLeitor.scrollLeft = 0;

  }

}

let toqueInicial = null;

let distanciaInicial = null;

btnMenos.addEventListener(

btnMais.addEventListener(
  "click",
  () => {

    zoom =
      Math.min(
        zoomMaximo,
        Number(
          (zoom + passoZoom)
          .toFixed(2)
        )
      );

    atualizarZoom();

  }
);


btnReset.addEventListener(
  "click",
  () => {

    zoom = 1;

    if (
      window.innerWidth <= 700
    ) {

      escalaMobile = 1;

      atualizarZoom();

    } else {

      atualizarZoom();

    }

  }
);


/* =========================
   FULLSCREEN
========================= */

btnFullscreen.addEventListener(
  "click",
  async () => {

    try {

      if (
        areaLeitor.requestFullscreen
      ) {

        await areaLeitor.requestFullscreen();

      }

    } catch (erro) {

      console.error(
        "Fullscreen:",

      );

  }
);


btnSairFullscreen.addEventListener(
  "click",
  async () => {

    if (
      document.fullscreenElement
    ) {

      await document.exitFullscreen();

    }

  }
);


document.addEventListener(
  "fullscreenchange",
  () => {

    const ativo =
      document.fullscreenElement ===
      areaLeitor;

    if (ativo) {

      areaLeitor.classList.add(
        "fullscreen"
      );

      btnSairFullscreen.style.display =
        "flex";

      btnSairFullscreen.style.alignItems =
        "center";

      btnSairFullscreen.style.justifyContent =
        "center";

      btnFullscreen.style.display =
        "none";

      document.body.style.overflow =
        "hidden";

    } else {

      areaLeitor.classList.remove(
        "fullscreen"
      );

      btnSairFullscreen.style.display =
        "none";

      btnFullscreen.style.display =
        "flex";

      document.body.style.overflow =
        "hidden";

  }
);

/* =========================
   PINCH ZOOM MOBILE
========================= */

function distanciaToque(
  toque1,
  toque2
) {

  const dx =
    toque1.clientX -
    toque2.clientX;

  const dy =
    toque1.clientY -
    toque2.clientY;

  return Math.sqrt(
    dx * dx +
    dy * dy
  );

}


areaLeitor.addEventListener(
  "touchstart",
  (evento) => {

    if (
      evento.touches.length === 2
    ) {

      distanciaInicial =
        distanciaToque(
          evento.touches[0],
          evento.touches[1]
        );

      escalaMobileAtual =
        escalaMobile;

    }

  },
  {
    passive: true
  }
);


let escalaMobileAtual = 1;


areaLeitor.addEventListener(
  "touchmove",
  (evento) => {

    if (
      evento.touches.length === 2 &&
      window.innerWidth <= 700
    ) {

      const distanciaAtual =
        distanciaToque(
          evento.touches[0],
          evento.touches[1]
        );

      if (
        distanciaInicial
      ) {

        const fator =
          distanciaAtual /
          distanciaInicial;

        escalaMobile =
          Math.min(
            4,
            Math.max(
              1,
              escalaMobileAtual *
              fator
            )
          );

        atualizarZoomMobile();

      }

      evento.preventDefault();

    }

  },
  {
    passive: false
  }
);


areaLeitor.addEventListener(
  "touchend",
  () => {

    distanciaInicial =
      null;

  },
  {
    passive: true
  }
);


/* =========================
   REDIMENSIONAMENTO
========================= */

window.addEventListener(
  "resize",
  () => {

    atualizarZoom();

  }
);

carregarPDF();
