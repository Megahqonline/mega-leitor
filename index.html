<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MegaHQ Online - Leitor</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #111;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        #controles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 55px;
            background: #222;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            z-index: 9999;
            color: white;
        }

        #controles button {
            border: none;
            background: #444;
            color: white;
            font-size: 20px;
            width: 40px;
            height: 36px;
            cursor: pointer;
            border-radius: 4px;
        }

        #controles button:hover {
            background: #666;
        }

        #zoomTexto {
            min-width: 60px;
            text-align: center;
            font-size: 15px;
        }

        #paginaTexto {
            margin-left: 15px;
            font-size: 14px;
        }

        #telaCheia {
            margin-left: 15px;
            font-size: 20px !important;
        }

        #areaLeitor {
            margin-top: 55px;
            width: 100vw;
            height: calc(100vh - 55px);
            overflow: auto;
            cursor: default;
        }

        #leitor {
            width: max-content;
            min-width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 20px;
        }

        .pagina {
            display: block;
            height: auto;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.5);
            user-select: none;
            -webkit-user-drag: none;
        }

        #areaLeitor.podeArrastar {
            cursor: grab;
        }

        #areaLeitor.arrastando {
            cursor: grabbing;
        }

        #carregando {
            color: white;
            font-size: 18px;
            text-align: center;
            padding: 30px;
        }

    </style>

</head>


<body>


    <div id="controles">

        <button id="menosZoom">
            −
        </button>

        <span id="zoomTexto">
            100%
        </span>

        <button id="maisZoom">
            +
        </button>

        <button id="zoom100">
            100%
        </button>

        <span id="paginaTexto">
            Carregando...
        </span>

        <button id="telaCheia">
            ⛶
        </button>

    </div>


    <div id="areaLeitor">

        <div id="leitor"></div>

    </div>


    <div id="carregando">
        Carregando HQ...
    </div>


    <script type="module">


        import * as pdfjsLib from
        "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.mjs";


        pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.mjs";


        /*
        =====================================================
        PDF DEFINIDO PELA URL
        =====================================================
        */


        const parametros =
        new URLSearchParams(window.location.search);


        const pdfParametro =
        parametros.get("pdf");


        /*
        Se não houver ?pdf= na URL,
        usa o PDF antigo como padrão.
        */


        const pdfUrl =
        pdfParametro
        ? "./" + encodeURIComponent(pdfParametro).replace(/%2F/g, "/")
        : "./UBS%20CIDADE%20LUZ%20PREVIAS.pdf";



        /* ELEMENTOS */

        const leitor =
        document.getElementById("leitor");

        const carregando =
        document.getElementById("carregando");

        const areaLeitor =
        document.getElementById("areaLeitor");

        const zoomTexto =
        document.getElementById("zoomTexto");

        const paginaTexto =
        document.getElementById("paginaTexto");

        const menosZoom =
        document.getElementById("menosZoom");

        const maisZoom =
        document.getElementById("maisZoom");

        const zoom100 =
        document.getElementById("zoom100");

        const telaCheia =
        document.getElementById("telaCheia");



        /* CONFIGURAÇÃO */

        let zoom = 1;

        const zoomMinimo = 0.5;

        const zoomMaximo = 3;

        const passoZoom = 0.25;

        let pdf = null;



        /* CARREGAR PDF */

        async function carregarPDF() {

            try {

                pdf =
                await pdfjsLib
                .getDocument(pdfUrl)
                .promise;


                carregando.style.display = "none";


                paginaTexto.innerText =
                "Página 1 / " + pdf.numPages;


                await renderizarPaginas();


                atualizarInterface();

            }

            catch (erro) {

                carregando.innerText =
                "Erro ao carregar o PDF.";

                console.error(erro);

            }

        }



        /* RENDERIZAR PÁGINAS */

        async function renderizarPaginas() {

            leitor.innerHTML = "";


            const escalaBase = 1.5;


            for (
                let numero = 1;
                numero <= pdf.numPages;
                numero++
            ) {

                const pagina =
                await pdf.getPage(numero);


                const escala =
                escalaBase * zoom;


                const viewport =
                pagina.getViewport({
                    scale: escala
                });


                const canvas =
                document.createElement("canvas");


                canvas.className =
                "pagina";


                const contexto =
                canvas.getContext("2d");


                canvas.width =
                viewport.width;


                canvas.height =
                viewport.height;


                canvas.style.width =
                viewport.width + "px";


                canvas.style.height =
                viewport.height + "px";


                leitor.appendChild(canvas);


                await pagina.render({

                    canvasContext:
                    contexto,

                    viewport:
                    viewport

                }).promise;

            }


            atualizarInterface();

        }



        /* ATUALIZAR INTERFACE */

        function atualizarInterface() {

            zoomTexto.innerText =
            Math.round(zoom * 100) + "%";


            if (pdf) {

                paginaTexto.innerText =
                "Página 1 / " + pdf.numPages;

            }


            if (zoom > 1) {

                areaLeitor.classList.add(
                    "podeArrastar"
                );

            }

            else {

                areaLeitor.classList.remove(
                    "podeArrastar"
                );

            }

        }



        /* AUMENTAR ZOOM */

        maisZoom.addEventListener(
            "click",
            async function () {

                if (
                    zoom >= zoomMaximo
                ) {
                    return;
                }


                zoom += passoZoom;


                if (
                    zoom > zoomMaximo
                ) {
                    zoom = zoomMaximo;
                }


                await renderizarPaginas();

            }
        );



        /* DIMINUIR ZOOM */

        menosZoom.addEventListener(
            "click",
            async function () {

                if (
                    zoom <= zoomMinimo
                ) {
                    return;
                }


                zoom -= passoZoom;


                if (
                    zoom < zoomMinimo
                ) {
                    zoom = zoomMinimo;
                }


                await renderizarPaginas();

            }
        );



        /* VOLTAR PARA 100% */

        zoom100.addEventListener(
            "click",
            async function () {

                zoom = 1;


                await renderizarPaginas();


                areaLeitor.scrollLeft = 0;

                areaLeitor.scrollTop = 0;

            }
        );



        /* =====================================================
           ARRASTAR A PÁGINA
           ===================================================== */


        let arrastando = false;

        let inicioX = 0;

        let inicioY = 0;

        let scrollInicialX = 0;

        let scrollInicialY = 0;


        areaLeitor.addEventListener(
            "mousedown",
            function (evento) {

                if (zoom <= 1) {
                    return;
                }


                arrastando = true;


                inicioX =
                evento.clientX;


                inicioY =
                evento.clientY;


                scrollInicialX =
                areaLeitor.scrollLeft;


                scrollInicialY =
                areaLeitor.scrollTop;


                areaLeitor.classList.remove(
                    "podeArrastar"
                );


                areaLeitor.classList.add(
                    "arrastando"
                );


                evento.preventDefault();

            }
        );


        areaLeitor.addEventListener(
            "mousemove",
            function (evento) {

                if (!arrastando) {
                    return;
                }


                const deslocamentoX =
                evento.clientX - inicioX;


                const deslocamentoY =
                evento.clientY - inicioY;


                areaLeitor.scrollLeft =
                scrollInicialX -
                deslocamentoX;


                areaLeitor.scrollTop =
                scrollInicialY -
                deslocamentoY;

            }
        );


        document.addEventListener(
            "mouseup",
            function () {

                if (!arrastando) {
                    return;
                }


                arrastando = false;


                areaLeitor.classList.remove(
                    "arrastando"
                );


                if (zoom > 1) {

                    areaLeitor.classList.add(
                        "podeArrastar"
                    );

                }

            }
        );


        areaLeitor.addEventListener(
            "dragstart",
            function (evento) {

                evento.preventDefault();

            }
        );



        /* =====================================================
           TELA CHEIA
           ===================================================== */


        telaCheia.addEventListener(
            "click",
            async function () {

                try {

                    if (!document.fullscreenElement) {

                        await document.documentElement
                        .requestFullscreen();

                    }

                    else {

                        await document.exitFullscreen();

                    }

                }

                catch (erro) {

                    console.error(
                        "Erro ao ativar tela cheia:",
                        erro
                    );

                }

            }
        );


        document.addEventListener(
            "fullscreenchange",
            function () {

                if (document.fullscreenElement) {

                    telaCheia.innerText = "✕";

                    document.body.classList.add(
                        "modoTelaCheia"
                    );

                }

                else {

                    telaCheia.innerText = "⛶";

                    document.body.classList.remove(
                        "modoTelaCheia"
                    );

                }

            }
        );



        /* INICIAR */

        carregarPDF();


    </script>


</body>

</html>
