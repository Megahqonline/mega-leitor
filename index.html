<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">

    <meta name="admaven-placement" content="BrHr6rTs4">

    <title>MegaHQ Online - Leitor</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;

            padding: 0;

            background: #111;

            font-family: Arial, sans-serif;

            overflow-x: hidden;

        }


        /*
        =====================================================
        BARRA DE CONTROLES
        =====================================================
        */

        #controles {

            position: fixed;

            top: 0;

            left: 0;

            width: 100%;

            height: 55px;

            background: #222;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            z-index: 9999;

            color: white;

        }


        #controles button {

            border: none;

            background: #444;

            color: white;

            font-size: 20px;

            width: 40px;

            height: 36px;

            cursor: pointer;

            border-radius: 4px;

        }


        #controles button:hover {

            background: #666;

        }


        #zoomTexto {

            min-width: 60px;

            text-align: center;

            font-size: 15px;

        }


        #paginaTexto {

            margin-left: 15px;

            font-size: 14px;

        }


        #telaCheia {

            margin-left: 15px;

            font-size: 20px !important;

        }


        /*
        =====================================================
        ÁREA DO LEITOR - COMPUTADOR
        =====================================================
        */

        #areaLeitor {

            margin-top: 55px;

            width: 80vw;

            margin-left: 10vw;

            height: calc(100vh - 55px);

            overflow: auto;

            cursor: default;

            touch-action: auto;

        }


        /*
        =====================================================
        CONTEÚDO
        =====================================================
        */

        #leitor {

            width: max-content;

            min-width: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 10px;

            padding: 20px;

        }


        .pagina {

            display: block;

            height: auto;

            box-shadow: 0 0 8px rgba(0, 0, 0, 0.5);

            user-select: none;

            -webkit-user-drag: none;

        }


        #areaLeitor.podeArrastar {

            cursor: grab;

        }


        #areaLeitor.arrastando {

            cursor: grabbing;

        }


        #carregando {

            color: white;

            font-size: 18px;

            text-align: center;

            padding: 30px;

        }


        /*
        =====================================================
        MOBILE
        =====================================================
        */

        @media (max-width: 768px) {


            /*
            -------------------------------------------------
            REMOVE CONTROLES DE ZOOM
            -------------------------------------------------
            */

            #menosZoom,
            #maisZoom,
            #zoomTexto,
            #zoom100 {

                display: none;

            }


            #paginaTexto {

                margin-left: 0;

            }


            #telaCheia {

                margin-left: 10px;

            }


            /*
            -------------------------------------------------
            LEITOR OCUPA TODA A TELA
            -------------------------------------------------
            */

            #areaLeitor {

                width: 100vw;

                margin-left: 0;

                height: calc(100vh - 55px);

                overflow-x: hidden;

                overflow-y: auto;

                touch-action: pan-x pan-y pinch-zoom;

            }


            /*
            -------------------------------------------------
            CONTEÚDO MOBILE
            -------------------------------------------------
            */

            #leitor {

                width: 100%;

                min-width: 100%;

                padding: 0;

                gap: 0;

                align-items: center;

            }


            /*
            -------------------------------------------------
            PÁGINAS MOBILE
            -------------------------------------------------
            */

            .pagina {

                width: 100vw;

                max-width: 100vw;

                height: auto;

                box-shadow: none;

            }

        }


    </style>

</head>


<body>


    <div id="controles">


        <button id="menosZoom">
            −
        </button>


        <span id="zoomTexto">
            50%
        </span>


        <button id="maisZoom">
            +
        </button>


        <button id="zoom100">
            100%
        </button>


        <span id="paginaTexto">
            Carregando...
        </span>


        <button id="telaCheia">
            ⛶
        </button>


    </div>



    <div id="areaLeitor">

        <div id="leitor"></div>

    </div>



    <div id="carregando">

        Carregando HQ...

    </div>



    <script type="module">


        import * as pdfjsLib from
        "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.mjs";


        pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.mjs";



        /*
        =====================================================
        PDF DEFINIDO PELA URL
        =====================================================
        */


        const parametros =
        new URLSearchParams(window.location.search);


        const driveId =
        parametros.get("id");


        const pdfParametro =
        parametros.get("pdf");


        let pdfUrl;



        /*
        =====================================================
        GOOGLE DRIVE
        =====================================================
        */


        if (driveId) {

            pdfUrl =
            "https://polished-term-e56bmega-leitor-proxy.megahqwix.workers.dev/?id="
            + encodeURIComponent(driveId);

        }



        /*
        =====================================================
        PDF LOCAL NO GITHUB
        =====================================================
        */


        else if (pdfParametro) {

            pdfUrl =
            "./" +
            encodeURIComponent(pdfParametro)
            .replace(/%2F/g, "/");

        }



        /*
        =====================================================
        PDF PADRÃO
        =====================================================
        */


        else {

            pdfUrl =
            "./UBS%20CIDADE%20LUZ%20PREVIAS.pdf";

        }



        /*
        =====================================================
        ELEMENTOS
        =====================================================
        */


        const leitor =
        document.getElementById("leitor");


        const carregando =
        document.getElementById("carregando");


        const areaLeitor =
        document.getElementById("areaLeitor");


        const zoomTexto =
        document.getElementById("zoomTexto");


        const paginaTexto =
        document.getElementById("paginaTexto");


        const menosZoom =
        document.getElementById("menosZoom");


        const maisZoom =
        document.getElementById("maisZoom");


        const zoom100 =
        document.getElementById("zoom100");


        const telaCheia =
        document.getElementById("telaCheia");



        /*
        =====================================================
        DETECTAR MOBILE
        =====================================================
        */


        function ehMobile() {

            return window.innerWidth <= 768;

        }



        /*
        =====================================================
        CONFIGURAÇÃO DO ZOOM DESKTOP
        =====================================================
        */


        let zoom = 0.5;


        const zoomMinimo = 0.5;


        const zoomMaximo = 3;


        const passoZoom = 0.10;


        let pdf = null;



        /*
        =====================================================
        ESCALA BASE DESKTOP
        =====================================================
        */


        function calcularEscalaDesktop() {


            const larguraDisponivel =
            window.innerWidth * 0.80;


            /*
            Referência para o tamanho da página
            no computador.
            */

            return larguraDisponivel / 1000;

        }



        /*
        =====================================================
        RENDERIZAR MOBILE
        =====================================================
        */

        async function renderizarPaginaMobile(
            pagina,
            numero
        ) {


            /*
            -------------------------------------------------
            LARGURA VISUAL DA PÁGINA
            -------------------------------------------------
            */

            const larguraTela =
            areaLeitor.clientWidth;


            /*
            -------------------------------------------------
            VIEWPORT ORIGINAL
            -------------------------------------------------
            */

            const viewportOriginal =
            pagina.getViewport({
                scale: 1
            });


            /*
            -------------------------------------------------
            ESCALA PARA OCUPAR A TELA
            -------------------------------------------------
            */

            const escalaVisual =
            larguraTela /
            viewportOriginal.width;


            /*
            -------------------------------------------------
            PIXEL RATIO DO APARELHO
            -------------------------------------------------
            */

            const pixelRatio =
            Math.min(
                window.devicePixelRatio || 1,
                3
            );


            /*
            -------------------------------------------------
            ESCALA FINAL DE RENDERIZAÇÃO
            -------------------------------------------------
            */

            const escalaRender =
            escalaVisual * pixelRatio;


            /*
            -------------------------------------------------
            VIEWPORT DE ALTA RESOLUÇÃO
            -------------------------------------------------
            */

            const viewportRender =
            pagina.getViewport({

                scale: escalaRender

            });


            /*
            -------------------------------------------------
            CANVAS
            -------------------------------------------------
            */

            const canvas =
            document.createElement("canvas");


            canvas.className =
            "pagina";


            const contexto =
            canvas.getContext(
                "2d",
                {
                    alpha: false
                }
            );


            /*
            Resolução real do canvas.
            */

            canvas.width =
            Math.ceil(
                viewportRender.width
            );


            canvas.height =
            Math.ceil(
                viewportRender.height
            );


            /*
            Tamanho visual.
            */

            canvas.style.width =
            larguraTela + "px";


            canvas.style.height =
            Math.ceil(
                viewportOriginal.height *
                escalaVisual
            ) + "px";


            leitor.appendChild(canvas);


            /*
            -------------------------------------------------
            RENDERIZAR EM ALTA RESOLUÇÃO
            -------------------------------------------------
            */

            await pagina.render({

                canvasContext:
                contexto,

                viewport:
                viewportRender,

                transform:
                pixelRatio !== 1
                ? [pixelRatio, 0, 0, pixelRatio, 0, 0]
                : null

            }).promise;

        }



        /*
        =====================================================
        RENDERIZAR DESKTOP
        =====================================================
        */

        async function renderizarPaginaDesktop(
            pagina,
            numero
        ) {


            const escalaBase =
            calcularEscalaDesktop();


            const escala =
            escalaBase * zoom;


            const viewport =
            pagina.getViewport({

                scale:
                escala

            });


            const canvas =
            document.createElement("canvas");


            canvas.className =
            "pagina";


            const contexto =
            canvas.getContext("2d");


            canvas.width =
            viewport.width;


            canvas.height =
            viewport.height;


            canvas.style.width =
            viewport.width + "px";


            canvas.style.height =
            viewport.height + "px";


            leitor.appendChild(canvas);


            await pagina.render({

                canvasContext:
                contexto,

                viewport:
                viewport

            }).promise;

        }



        /*
        =====================================================
        RENDERIZAR TODAS AS PÁGINAS
        =====================================================
        */

        async function renderizarPaginas() {


            leitor.innerHTML = "";


            for (

                let numero = 1;

                numero <= pdf.numPages;

                numero++

            ) {


                const pagina =
                await pdf.getPage(numero);


                if (ehMobile()) {


                    await renderizarPaginaMobile(

                        pagina,

                        numero

                    );


                }


                else {


                    await renderizarPaginaDesktop(

                        pagina,

                        numero

                    );

                }

            }


            atualizarInterface();

        }



        /*
        =====================================================
        ATUALIZAR INTERFACE
        =====================================================
        */

        function atualizarInterface() {


            if (ehMobile()) {

                zoomTexto.innerText = "";

            }


            else {

                zoomTexto.innerText =
                Math.round(zoom * 100) + "%";

            }


            if (pdf) {

                paginaTexto.innerText =
                "Página 1 / " + pdf.numPages;

            }


            if (
                !ehMobile() &&
                zoom > 1
            ) {

                areaLeitor.classList.add(
                    "podeArrastar"
                );

            }


            else {

                areaLeitor.classList.remove(
                    "podeArrastar"
                );

            }

        }



        /*
        =====================================================
        CARREGAR PDF
        =====================================================
        */

        async function carregarPDF() {

            try {


                pdf =
                await pdfjsLib
                .getDocument(pdfUrl)
                .promise;


                carregando.style.display =
                "none";


                paginaTexto.innerText =
                "Página 1 / " + pdf.numPages;


                await renderizarPaginas();


                atualizarInterface();


            }


            catch (erro) {


                carregando.innerText =
                "Erro ao carregar o PDF.";


                console.error(erro);

            }

        }



        /*
        =====================================================
        AUMENTAR ZOOM - DESKTOP
        =====================================================
        */

        maisZoom.addEventListener(

            "click",

            async function () {


                if (ehMobile()) {

                    return;

                }


                if (zoom >= zoomMaximo) {

                    return;

                }


                zoom += passoZoom;


                zoom =
                Math.round(
                    zoom * 100
                ) / 100;


                if (zoom > zoomMaximo) {

                    zoom = zoomMaximo;

                }


                await renderizarPaginas();

            }

        );



        /*
        =====================================================
        DIMINUIR ZOOM - DESKTOP
        =====================================================
        */

        menosZoom.addEventListener(

            "click",

            async function () {


                if (ehMobile()) {

                    return;

                }


                if (zoom <= zoomMinimo) {

                    return;

                }


                zoom -= passoZoom;


                zoom =
                Math.round(
                    zoom * 100
                ) / 100;


                if (zoom < zoomMinimo) {

                    zoom = zoomMinimo;

                }


                await renderizarPaginas();

            }

        );



        /*
        =====================================================
        VOLTAR PARA 100% - DESKTOP
        =====================================================
        */

        zoom100.addEventListener(

            "click",

            async function () {


                if (ehMobile()) {

                    return;

                }


                zoom = 1;


                await renderizarPaginas();


                areaLeitor.scrollLeft = 0;


                areaLeitor.scrollTop = 0;

            }

        );



        /*
        =====================================================
        REDIMENSIONAMENTO
        =====================================================
        */

        let larguraAnterior =
        window.innerWidth;


        let alturaAnterior =
        window.innerHeight;


        let timerResize = null;


        window.addEventListener(

            "resize",

            function () {


                const novaLargura =
                window.innerWidth;


                const novaAltura =
                window.innerHeight;


                if (

                    novaLargura ===
                    larguraAnterior &&

                    novaAltura ===
                    alturaAnterior

                ) {

                    return;

                }


                larguraAnterior =
                novaLargura;


                alturaAnterior =
                novaAltura;


                clearTimeout(
                    timerResize
                );


                timerResize =
                setTimeout(

                    async function () {


                        if (!pdf) {

                            return;

                        }


                        await renderizarPaginas();


                    },

                    250

                );

            }

        );



        /*
        =====================================================
        ARRASTAR - DESKTOP
        =====================================================
        */

        let arrastando = false;


        let inicioX = 0;


        let inicioY = 0;


        let scrollInicialX = 0;


        let scrollInicialY = 0;



        areaLeitor.addEventListener(

            "mousedown",

            function (evento) {


                if (ehMobile()) {

                    return;

                }


                if (zoom <= 1) {

                    return;

                }


                arrastando = true;


                inicioX =
                evento.clientX;


                inicioY =
                evento.clientY;


                scrollInicialX =
                areaLeitor.scrollLeft;


                scrollInicialY =
                areaLeitor.scrollTop;


                areaLeitor.classList.remove(
                    "podeArrastar"
                );


                areaLeitor.classList.add(
                    "arrastando"
                );


                evento.preventDefault();

            }

        );



        areaLeitor.addEventListener(

            "mousemove",

            function (evento) {


                if (!arrastando) {

                    return;

                }


                const deslocamentoX =
                evento.clientX - inicioX;


                const deslocamentoY =
                evento.clientY - inicioY;


                areaLeitor.scrollLeft =
                scrollInicialX -
                deslocamentoX;


                areaLeitor.scrollTop =
                scrollInicialY -
                deslocamentoY;

            }

        );



        document.addEventListener(

            "mouseup",

            function () {


                if (!arrastando) {

                    return;

                }


                arrastando = false;


                areaLeitor.classList.remove(
                    "arrastando"
                );


                if (
                    !ehMobile() &&
                    zoom > 1
                ) {

                    areaLeitor.classList.add(
                        "podeArrastar"
                    );

                }

            }

        );



        areaLeitor.addEventListener(

            "dragstart",

            function (evento) {

                evento.preventDefault();

            }

        );



        /*
        =====================================================
        TELA CHEIA
        =====================================================
        */

        telaCheia.addEventListener(

            "click",

            async function () {


                try {


                    if (
                        !document.fullscreenElement
                    ) {


                        await document
                        .documentElement
                        .requestFullscreen();


                    }


                    else {


                        await document
                        .exitFullscreen();

                    }

                }


                catch (erro) {


                    console.error(

                        "Erro ao ativar tela cheia:",

                        erro

                    );

                }

            }

        );



        /*
        =====================================================
        ALTERAR ÍCONE DA TELA CHEIA
        =====================================================
        */

        document.addEventListener(

            "fullscreenchange",

            function () {


                if (
                    document.fullscreenElement
                ) {


                    telaCheia.innerText =
                    "✕";


                    document.body.classList.add(
                        "modoTelaCheia"
                    );

                }


                else {


                    telaCheia.innerText =
                    "⛶";


                    document.body.classList.remove(
                        "modoTelaCheia"
                    );

                }

            }

        );



        /*
        =====================================================
        INICIAR
        =====================================================
        */

        carregarPDF();


    </script>


</body>

</html>
