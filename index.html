<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes"
>

<title>MegaHQ Online</title>

<style>

/* =========================================================
   BASE
========================================================= */

* {
  box-sizing: border-box;
}

html,
body {

  margin: 0;
  padding: 0;

  width: 100%;
  min-height: 100%;

  background: #111;

  overflow-x: hidden;

}

body {

  font-family: Arial, sans-serif;

}


/* =========================================================
   BARRA SUPERIOR
========================================================= */

#barra {

  position: fixed;

  top: 0;
  left: 0;

  width: 100%;
  height: 55px;

  background: #1c1c1c;
  color: white;

  display: flex;

  align-items: center;
  justify-content: center;

  gap: 8px;

  z-index: 1000;

  box-shadow:
    0 2px 8px rgba(0,0,0,0.5);

}


#barra button {

  height: 36px;
  min-width: 36px;

  border: none;
  border-radius: 5px;

  background: #333;
  color: white;

  font-size: 18px;

  cursor: pointer;

}


#barra button:hover {

  background: #444;

}


#zoomTexto {

  min-width: 55px;

  text-align: center;

  font-size: 14px;

}


#fullscreen {

  font-size: 20px;

}


/* =========================================================
   ÁREA DO LEITOR
========================================================= */

#areaLeitor {

  margin-top: 55px;

  width: 80vw;

  margin-left: 10vw;

  height: calc(100vh - 55px);

  overflow: auto;

  background: #111;

  cursor: default;

  -webkit-overflow-scrolling: touch;

  scrollbar-width: auto;

}


/* =========================================================
   STAGE

   O stage recebe o tamanho visual ampliado.
   Isso permite que o navegador mantenha corretamente
   as barras de rolagem mesmo quando usamos transform.
========================================================= */

#mobileStage {

  position: relative;

  width: 100%;
  min-height: 100%;

}


/* =========================================================
   LEITOR

   A escala visual será aplicada aqui.

   O tamanho real das páginas não é alterado quando
   o usuário aperta + ou -.
========================================================= */

#leitor {

  width: max-content;

  min-width: 100%;

  display: flex;

  flex-direction: column;

  align-items: center;

  gap: 10px;

  padding: 20px;

  transform-origin: 0 0;

  will-change: transform;

}


/* =========================================================
   PÁGINAS
========================================================= */

canvas {

  display: block;

  max-width: none;

  height: auto;

  background: white;

  box-shadow:
    0 2px 8px rgba(0,0,0,0.5);

  user-select: none;

  -webkit-user-select: none;

  -webkit-touch-callout: none;

  image-rendering: auto;

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 768px) {

  #barra {

    height: 50px;

  }


  #menosZoom,
  #maisZoom,
  #zoomTexto,
  #zoom100 {

    display: none;

  }


  #areaLeitor {

    margin-top: 50px;

    width: 100vw;

    margin-left: 0;

    height: calc(100vh - 50px);

    overflow: auto;

    touch-action: pan-x pan-y;

    -webkit-overflow-scrolling: touch;

    overscroll-behavior: contain;

  }


  #mobileStage {

    width: 100%;

    min-height: 100%;

  }


  #leitor {

    padding: 0;

    gap: 0;

    align-items: flex-start;

    min-width: 0;

    width: 100%;

  }


  canvas {

    width: 100vw;

    max-width: none;

    height: auto;

    box-shadow: none;

  }

}


/* =========================================================
   TELA CHEIA
========================================================= */

:fullscreen #barra {

  display: flex;

}


:fullscreen #areaLeitor {

  margin-top: 55px;

  height: calc(100vh - 55px);

}

</style>

</head>


<body>


<!-- =======================================================
     BARRA
======================================================= -->

<div id="barra">

  <button
    id="menosZoom"
    title="Diminuir zoom"
  >
    −
  </button>


  <span id="zoomTexto">
    50%
  </span>


  <button
    id="maisZoom"
    title="Aumentar zoom"
  >
    +
  </button>


  <button
    id="zoom100"
    title="Voltar para 100%"
  >
    100%
  </button>


  <button
    id="fullscreen"
    title="Tela cheia"
  >
    ⛶
  </button>

</div>


<!-- =======================================================
     LEITOR
======================================================= -->

<div id="areaLeitor">

  <div id="mobileStage">

    <div id="leitor"></div>

  </div>

</div>


<!-- =======================================================
     PDF.JS
======================================================= -->

<script type="module">

import * as pdfjsLib from
  "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs";


pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs";


/* =========================================================
   ELEMENTOS
========================================================= */

const areaLeitor =
  document.getElementById("areaLeitor");

const mobileStage =
  document.getElementById("mobileStage");

const leitor =
  document.getElementById("leitor");


const menosZoom =
  document.getElementById("menosZoom");

const maisZoom =
  document.getElementById("maisZoom");

const zoomTexto =
  document.getElementById("zoomTexto");

const zoom100 =
  document.getElementById("zoom100");

const fullscreen =
  document.getElementById("fullscreen");


/* =========================================================
   CONFIGURAÇÕES DESKTOP
========================================================= */

let zoom = 0.5;

const passoZoom = 0.10;

const zoomMinimo = 0.5;

const zoomMaximo = 3.0;


/*
   Escala real utilizada para renderizar o PDF.

   O PDF será renderizado UMA VEZ em 100%.

   Depois disso o zoom será feito visualmente.
*/

let escalaBaseDesktop = 1;


/* =========================================================
   CONFIGURAÇÕES MOBILE
========================================================= */

let mobileScale = 1;

const mobileScaleMin = 1;

const mobileScaleMax = 4;


/* =========================================================
   PDF
========================================================= */

let pdf = null;


/* =========================================================
   DETECTAR MOBILE
========================================================= */

function ehMobile() {

  return window.innerWidth <= 768;

}


/* =========================================================
   ESCALA BASE DESKTOP
========================================================= */

function calcularEscalaDesktop() {

  const larguraDisponivel =
    window.innerWidth * 0.80;


  /*
    A largura de referência continua sendo
    aproximadamente 1000 px, como no seu
    leitor anterior.
  */

  return larguraDisponivel / 1000;

}


/* =========================================================
   RENDER DESKTOP
========================================================= */

async function renderizarPaginaDesktop(page) {

  /*
    IMPORTANTE:

    A página é renderizada sempre em 100%.

    O zoom de 50%, 60%, 70%...
    será feito pelo CSS.

    Assim não precisamos apagar e reconstruir
    as páginas a cada clique.
  */

  const viewport =
    page.getViewport({
      scale: escalaBaseDesktop
    });


  const canvas =
    document.createElement("canvas");


  const contexto =
    canvas.getContext("2d");


  /*
    Renderização em alta resolução.

    Limitamos a 2x para evitar consumo exagerado
    de memória em HQs com muitas páginas.
  */

  const pixelRatio =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );


  canvas.width =
    Math.floor(
      viewport.width * pixelRatio
    );


  canvas.height =
    Math.floor(
      viewport.height * pixelRatio
    );


  /*
    Tamanho visual correspondente a 100%.
  */

  canvas.style.width =
    viewport.width + "px";


  canvas.style.height =
    viewport.height + "px";


  await page.render({

    canvasContext: contexto,

    viewport: viewport,

    transform:
      pixelRatio !== 1
        ? [
            pixelRatio,
            0,
            0,
            pixelRatio,
            0,
            0
          ]
        : null

  }).promise;


  leitor.appendChild(canvas);

}


/* =========================================================
   RENDER MOBILE
========================================================= */

async function renderizarPaginaMobile(page) {

  const viewportOriginal =
    page.getViewport({
      scale: 1
    });


  const larguraTela =
    areaLeitor.clientWidth;


  /*
    Faz a página caber exatamente na largura
    disponível do celular.
  */

  const escalaVisual =
    larguraTela /
    viewportOriginal.width;


  /*
    Renderizamos em alta resolução.

    Mínimo de 2x e máximo de 3x.
  */

  const pixelRatio =
    Math.min(
      Math.max(
        window.devicePixelRatio || 1,
        2
      ),
      3
    );


  const viewport =
    page.getViewport({
      scale: escalaVisual
    });


  const canvas =
    document.createElement("canvas");


  const contexto =
    canvas.getContext("2d");


  /*
    Tamanho real do canvas.
  */

  canvas.width =
    Math.floor(
      viewport.width * pixelRatio
    );


  canvas.height =
    Math.floor(
      viewport.height * pixelRatio
    );


  /*
    Tamanho visual.
  */

  canvas.style.width =
    viewport.width + "px";


  canvas.style.height =
    viewport.height + "px";


  await page.render({

    canvasContext: contexto,

    viewport: viewport,

    transform: [
      pixelRatio,
      0,
      0,
      pixelRatio,
      0,
      0
    ]

  }).promise;


  leitor.appendChild(canvas);

}


/* =========================================================
   APLICAR ESCALA VISUAL
========================================================= */

function aplicarEscalaVisual() {

  const escalaAtual =
    ehMobile()
      ? mobileScale
      : zoom;


  leitor.style.transform =
    `scale(${escalaAtual})`;


  atualizarTamanhoStage();

}


/* =========================================================
   ATUALIZAR TAMANHO DO STAGE
========================================================= */

function atualizarTamanhoStage() {

  /*
    O tamanho natural do conteúdo antes do transform.
  */

  const larguraBase =
    leitor.offsetWidth;


  const alturaBase =
    leitor.offsetHeight;


  const escalaAtual =
    ehMobile()
      ? mobileScale
      : zoom;


  /*
    O Stage precisa acompanhar o conteúdo ampliado.
  */

  mobileStage.style.width =
    Math.max(
      areaLeitor.clientWidth,
      larguraBase * escalaAtual
    ) + "px";


  mobileStage.style.height =
    Math.max(
      areaLeitor.clientHeight,
      alturaBase * escalaAtual
    ) + "px";

}


/* =========================================================
   RENDERIZAR PDF UMA ÚNICA VEZ
========================================================= */

async function renderizarPDF() {

  /*
    Limpa somente quando realmente precisamos
    reconstruir o PDF.

    Isso NÃO acontece quando apertamos + ou -.
  */

  leitor.innerHTML = "";


  mobileStage.style.width = "100%";

  mobileStage.style.height = "100%";


  leitor.style.transform =
    "scale(1)";


  /*
    MOBILE
  */

  if (ehMobile()) {

    mobileScale = 1;


    for (
      let i = 1;
      i <= pdf.numPages;
      i++
    ) {

      const page =
        await pdf.getPage(i);


      await renderizarPaginaMobile(page);

    }


    aplicarEscalaVisual();

    return;

  }


  /*
    DESKTOP
  */

  escalaBaseDesktop =
    calcularEscalaDesktop();


  /*
    Todas as páginas são renderizadas
    em 100%.
  */

  for (
    let i = 1;
    i <= pdf.numPages;
    i++
  ) {

    const page =
      await pdf.getPage(i);


    await renderizarPaginaDesktop(page);

  }


  /*
    Depois que todas as páginas existem,
    aplicamos o zoom inicial de 50%.
  */

  aplicarEscalaVisual();

}


/* =========================================================
   ZOOM DESKTOP EM TEMPO REAL
========================================================= */

function alterarZoomDesktop(novoZoom) {

  if (ehMobile()) {
    return;
  }


  /*
    Limita o zoom.
  */

  novoZoom =
    Math.max(
      zoomMinimo,
      Math.min(
        zoomMaximo,
        novoZoom
      )
    );


  /*
    Centro atual da área visível.

    Vamos manter esse ponto no mesmo lugar
    durante o zoom.
  */

  const centroX =
    areaLeitor.scrollLeft +
    areaLeitor.clientWidth / 2;


  const centroY =
    areaLeitor.scrollTop +
    areaLeitor.clientHeight / 2;


  /*
    Transformamos a posição atual em coordenada
    relativa ao conteúdo sem zoom.
  */

  const pontoX =
    centroX / zoom;


  const pontoY =
    centroY / zoom;


  /*
    Aplica o novo zoom imediatamente.

    NÃO há renderização do PDF.
  */

  zoom = novoZoom;


  zoomTexto.textContent =
    Math.round(zoom * 100) + "%";


  /*
    Atualiza o tamanho do Stage.
  */

  aplicarEscalaVisual();


  /*
    Reposiciona o scroll para manter exatamente
    a região que estava sendo visualizada.
  */

  const novoCentroX =
    pontoX * zoom;


  const novoCentroY =
    pontoY * zoom;


  areaLeitor.scrollLeft =
    Math.max(
      0,
      novoCentroX -
      areaLeitor.clientWidth / 2
    );


  areaLeitor.scrollTop =
    Math.max(
      0,
      novoCentroY -
      areaLeitor.clientHeight / 2
    );

}


/* =========================================================
   BOTÃO MENOS
========================================================= */

menosZoom.addEventListener(
  "click",
  function() {

    alterarZoomDesktop(
      zoom - passoZoom
    );

  }
);


/* =========================================================
   BOTÃO MAIS
========================================================= */

maisZoom.addEventListener(
  "click",
  function() {

    alterarZoomDesktop(
      zoom + passoZoom
    );

  }
);


/* =========================================================
   BOTÃO 100%
========================================================= */

zoom100.addEventListener(
  "click",
  function() {

    alterarZoomDesktop(1);

  }
);


/* =========================================================
   PINCH MOBILE
========================================================= */

let pinchAtivo = false;

let distanciaInicial = 0;

let escalaInicialPinch = 1;


/* =========================================================
   DISTÂNCIA ENTRE DEDOS
========================================================= */

function distanciaEntreDedos(
  touch1,
  touch2
) {

  const dx =
    touch2.clientX -
    touch1.clientX;


  const dy =
    touch2.clientY -
    touch1.clientY;


  return Math.sqrt(
    dx * dx +
    dy * dy
  );

}


/* =========================================================
   CENTRO DOS DEDOS
========================================================= */

function centroDosDedos(
  touch1,
  touch2
) {

  return {

    x:
      (
        touch1.clientX +
        touch2.clientX
      ) / 2,


    y:
      (
        touch1.clientY +
        touch2.clientY
      ) / 2

  };

}


/* =========================================================
   TOUCH START
========================================================= */

areaLeitor.addEventListener(
  "touchstart",
  function(event) {

    if (!ehMobile()) {
      return;
    }


    if (event.touches.length === 2) {

      pinchAtivo = true;


      const t1 =
        event.touches[0];


      const t2 =
        event.touches[1];


      distanciaInicial =
        distanciaEntreDedos(
          t1,
          t2
        );


      escalaInicialPinch =
        mobileScale;

    }

  },
  {
    passive: true
  }
);


/* =========================================================
   TOUCH MOVE
========================================================= */

areaLeitor.addEventListener(
  "touchmove",
  function(event) {

    if (!ehMobile()) {
      return;
    }


    /*
      Com um dedo deixamos o navegador
      cuidar normalmente da rolagem.
    */

    if (
      event.touches.length !== 2 ||
      !pinchAtivo
    ) {

      return;

    }


    /*
      Com dois dedos fazemos o pinch.
    */

    event.preventDefault();


    const t1 =
      event.touches[0];


    const t2 =
      event.touches[1];


    const distanciaAtual =
      distanciaEntreDedos(
        t1,
        t2
      );


    if (distanciaInicial <= 0) {
      return;
    }


    const fator =
      distanciaAtual /
      distanciaInicial;


    let novaEscala =
      escalaInicialPinch *
      fator;


    novaEscala =
      Math.max(
        mobileScaleMin,
        Math.min(
          mobileScaleMax,
          novaEscala
        )
      );


    /*
      Mantemos o ponto entre os dedos.
    */

    const centro =
      centroDosDedos(
        t1,
        t2
      );


    const rect =
      areaLeitor.getBoundingClientRect();


    const centroX =
      centro.x -
      rect.left;


    const centroY =
      centro.y -
      rect.top;


    /*
      Coordenada do conteúdo antes do zoom.
    */

    const pontoX =
      (
        areaLeitor.scrollLeft +
        centroX
      ) / mobileScale;


    const pontoY =
      (
        areaLeitor.scrollTop +
        centroY
      ) / mobileScale;


    mobileScale =
      novaEscala;


    aplicarEscalaVisual();


    /*
      Reposiciona a tela.
    */

    const novoScrollX =
      pontoX * mobileScale -
      centroX;


    const novoScrollY =
      pontoY * mobileScale -
      centroY;


    const maxScrollX =
      Math.max(
        0,
        areaLeitor.scrollWidth -
        areaLeitor.clientWidth
      );


    const maxScrollY =
      Math.max(
        0,
        areaLeitor.scrollHeight -
        areaLeitor.clientHeight
      );


    areaLeitor.scrollLeft =
      Math.max(
        0,
        Math.min(
          novoScrollX,
          maxScrollX
        )
      );


    areaLeitor.scrollTop =
      Math.max(
        0,
        Math.min(
          novoScrollY,
          maxScrollY
        )
      );

  },
  {
    passive: false
  }
);


/* =========================================================
   TOUCH END
========================================================= */

areaLeitor.addEventListener(
  "touchend",
  function(event) {

    if (!ehMobile()) {
      return;
    }


    if (event.touches.length < 2) {

      pinchAtivo = false;

      distanciaInicial = 0;

    }

  },
  {
    passive: true
  }
);


/* =========================================================
   TOUCH CANCEL
========================================================= */

areaLeitor.addEventListener(
  "touchcancel",
  function() {

    pinchAtivo = false;

    distanciaInicial = 0;

  },
  {
    passive: true
  }
);


/* =========================================================
   ARRASTAR COM MOUSE — DESKTOP
========================================================= */

let arrastando = false;

let inicioX = 0;
let inicioY = 0;

let scrollInicialX = 0;
let scrollInicialY = 0;


areaLeitor.addEventListener(
  "mousedown",
  function(event) {

    if (ehMobile()) {
      return;
    }


    if (zoom <= 1) {
      return;
    }


    arrastando = true;


    inicioX =
      event.clientX;


    inicioY =
      event.clientY;


    scrollInicialX =
      areaLeitor.scrollLeft;


    scrollInicialY =
      areaLeitor.scrollTop;


    areaLeitor.style.cursor =
      "grabbing";

  }
);


window.addEventListener(
  "mousemove",
  function(event) {

    if (
      !arrastando ||
      ehMobile()
    ) {

      return;

    }


    const deslocamentoX =
      event.clientX -
      inicioX;


    const deslocamentoY =
      event.clientY -
      inicioY;


    areaLeitor.scrollLeft =
      scrollInicialX -
      deslocamentoX;


    areaLeitor.scrollTop =
      scrollInicialY -
      deslocamentoY;

  }
);


window.addEventListener(
  "mouseup",
  function() {

    if (!arrastando) {
      return;
    }


    arrastando = false;


    areaLeitor.style.cursor =
      "default";

  }
);


/* =========================================================
   TELA CHEIA
========================================================= */

fullscreen.addEventListener(
  "click",
  async function() {

    try {

      if (!document.fullscreenElement) {

        await document.documentElement.requestFullscreen();

        fullscreen.textContent = "✕";

      }

      else {

        await document.exitFullscreen();

        fullscreen.textContent = "⛶";

      }

    }

    catch (erro) {

      console.error(
        "Erro ao abrir tela cheia:",
        erro
      );

    }

  }
);


/* =========================================================
   FULLSCREEN CHANGE
========================================================= */

document.addEventListener(
  "fullscreenchange",
  function() {

    if (document.fullscreenElement) {

      fullscreen.textContent = "✕";

    }

    else {

      fullscreen.textContent = "⛶";

    }

  }
);


/* =========================================================
   REDIMENSIONAMENTO
========================================================= */

let resizeTimer = null;


window.addEventListener(
  "resize",
  function() {

    clearTimeout(resizeTimer);


    resizeTimer =
      setTimeout(
        async function() {

          /*
            Só reconstruímos quando a janela realmente
            mudou de tamanho.

            O zoom normal NÃO passa por aqui.
          */

          if (pdf) {

            await renderizarPDF();

          }

        },
        300
      );

  }
);


/* =========================================================
   CARREGAR PDF
========================================================= */

async function carregarPDF() {

  const parametros =
    new URLSearchParams(
      window.location.search
    );


  const id =
    parametros.get("id");


  const arquivo =
    parametros.get("pdf");


  let urlPDF;


  /*
    GOOGLE DRIVE
  */

  if (id) {

    urlPDF =
      "https://polished-term-e56bmega-leitor-proxy.megahqwix.workers.dev/?id="
      +
      encodeURIComponent(id);

  }


  /*
    ARQUIVO LOCAL
  */

  else if (arquivo) {

    urlPDF =
      arquivo;

  }


  /*
    PDF PADRÃO
  */

  else {

    urlPDF =
      "UBS CIDADE LUZ PREVIAS.pdf";

  }


  try {

    pdf =
      await pdfjsLib.getDocument(
        urlPDF
      ).promise;


    await renderizarPDF();

  }

  catch (erro) {

    console.error(
      "Erro ao carregar PDF:",
      erro
    );


    leitor.innerHTML = "";


    const mensagem =
      document.createElement("div");


    mensagem.style.color =
      "white";


    mensagem.style.padding =
      "30px";


    mensagem.style.fontSize =
      "18px";


    mensagem.textContent =
      "Não foi possível carregar o PDF.";


    leitor.appendChild(
      mensagem
    );

  }

}


/* =========================================================
   INICIAR
========================================================= */

carregarPDF();

</script>

</body>

</html>
