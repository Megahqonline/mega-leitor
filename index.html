<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#111;
  overflow-x:hidden;
}

body{
  font-family:Arial,sans-serif;
}

/* BARRA */

#barra{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:55px;
  background:#1c1c1c;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  z-index:1000;
  box-shadow:0 2px 8px rgba(0,0,0,0.5);
}

#barra button{
  height:36px;
  min-width:36px;
  border:none;
  border-radius:5px;
  background:#333;
  color:white;
  font-size:18px;
  cursor:pointer;
}

#barra button:hover{
  background:#444;
}

#zoomTexto{
  min-width:55px;
  text-align:center;
  font-size:14px;
}

#fullscreen{
  font-size:20px;
}

#download{
  font-size:19px;
}

#download:disabled{
  opacity:0.5;
  cursor:default;
}

/* LEITOR */

#areaLeitor{
  margin-top:50px;
  width:100vw;
  margin-left:0;
  height:calc(100vh - 50px);
  overflow:auto;
  touch-action:pan-x pan-y;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
}

#mobileStage{
  position:relative;
  width:max-content;
  min-width:100%;
  min-height:100%;
}

#leitor{
  width:max-content;
  min-width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  padding:20px;
  transform-origin:center top;
}

canvas{
  display:block;
  max-width:none;
  height:auto;
  background:white;
  box-shadow:0 2px 8px rgba(0,0,0,0.5);
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
  image-rendering:auto;
}

/* DESKTOP */

@media (min-width:769px){

  #areaLeitor{
    overflow:auto;
  }

}

/* CELULAR */

@media (max-width:768px){

  #barra{
    height:50px;
  }

  #menosZoom,
  #maisZoom,
  #zoomTexto,
  #zoom100{
    display:none;
  }

  #areaLeitor{
    margin-top:50px;
    width:100vw;
    margin-left:0;
    height:calc(100vh - 50px);
    overflow:auto;
    touch-action:pan-x pan-y;
    -webkit-overflow-scrolling:touch;
  }

  #mobileStage{
    width:100%;
    min-height:100%;
  }

  #leitor{
    padding:0;
    gap:0;
    align-items:flex-start;
    min-width:0;
    width:100%;
    transform-origin:0 0;
  }

  canvas{
    width:100vw;
    max-width:none;
    height:auto;
    box-shadow:none;
  }

}

/* TELA CHEIA */

:fullscreen #barra{
  display:flex;
}

:fullscreen #areaLeitor{
  margin-top:55px;
  height:calc(100vh - 55px);
}

</style>

<div id="areaLeitor">

    <div id="leitor"></div>

<script
  src="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs"
  type="module"
></script>


<script type="module">

import * as pdfjsLib from
"https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs";


pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs";


/* ELEMENTOS */

const areaLeitor =
document.getElementById("areaLeitor");

const mobileStage =
document.getElementById("mobileStage");

const leitor =
document.getElementById("leitor");

const menosZoom =
document.getElementById("menosZoom");

const maisZoom =
document.getElementById("maisZoom");

const zoomTexto =
document.getElementById("zoomTexto");

const zoom100 =
document.getElementById("zoom100");

const fullscreen =
document.getElementById("fullscreen");

const download =
document.getElementById("download");


/* CONFIGURAÇÕES */

let zoom = 0.5;

const passoZoom = 0.10;

const zoomMinimo = 0.5;

const zoomMaximo = 3.0;

let mobileScale = 1;

const mobileScaleMin = 1;

const mobileScaleMax = 4;

let pdf = null;

let urlPDFAtual = "";

let nomeArquivoDownload = "MegaHQ.pdf";


/* MOBILE */

function ehMobile(){

  return window.innerWidth <= 768;

}


/* ESCALA DESKTOP */

function calcularEscalaDesktop(){

  const larguraDisponivel =
  window.innerWidth * 0.80;

  return larguraDisponivel / 1000;

}


/* RENDER DESKTOP */

async function renderizarPaginaDesktop(
  page,
  numeroPagina
){

  const escalaBase =
  calcularEscalaDesktop();

  const escalaFinal =
  escalaBase * zoom;

  const viewport =
  page.getViewport({
    scale:escalaFinal
  });

  const canvas =
  document.createElement("canvas");

  const contexto =
  canvas.getContext("2d");

  const pixelRatio =
  Math.min(
    window.devicePixelRatio || 1,
    2
  );

  canvas.width =
  Math.floor(
    viewport.width * pixelRatio
  );

  canvas.height =
  Math.floor(
    viewport.height * pixelRatio
  );

  canvas.style.width =
  viewport.width + "px";

  canvas.style.height =
  viewport.height + "px";

  await page.render({

    canvasContext:contexto,

    viewport:viewport,

    transform:
      pixelRatio !== 1
      ? [
          pixelRatio,
          0,
          0,
          pixelRatio,
          0,
          0
        ]
      : null

  }).promise;

  leitor.appendChild(canvas);

}


/* RENDER MOBILE */

async function renderizarPaginaMobile(page){

  const viewportOriginal =
  page.getViewport({
    scale:1
  });

  const larguraTela =
  areaLeitor.clientWidth;

  const escalaVisual =
  larguraTela /
  viewportOriginal.width;

  const pixelRatio =
  Math.min(
    Math.max(
      window.devicePixelRatio || 1,
      2
    ),
    3
  );

  const viewport =
  page.getViewport({
    scale:escalaVisual
  });

  const canvas =
  document.createElement("canvas");

  const contexto =
  canvas.getContext("2d");

  canvas.width =
  Math.floor(
    viewport.width * pixelRatio
  );

  canvas.height =
  Math.floor(
    viewport.height * pixelRatio
  );

  canvas.style.width =
  viewport.width + "px";

  canvas.style.height =
  viewport.height + "px";

  await page.render({

    canvasContext:contexto,

    viewport:viewport,

    transform:[
      pixelRatio,
      0,
      0,
      pixelRatio,
      0,
      0
    ]

  }).promise;

  leitor.appendChild(canvas);

}


/* RENDER PDF */

async function renderizarPDF(){

  leitor.innerHTML="";

  mobileStage.style.transform="";

  mobileScale=1;


  if(ehMobile()){

    for(
      let i=1;
      i<=pdf.numPages;
      i++
    ){

      const page =
      await pdf.getPage(i);

      await renderizarPaginaMobile(page);

    }

    atualizarMobileStage();

    return;

  }


  for(
    let i=1;
    i<=pdf.numPages;
    i++
  ){

    const page =
    await pdf.getPage(i);

    await renderizarPaginaDesktop(
      page,
      i
    );

  }


  const larguraHQ =
  leitor.scrollWidth;

  const larguraTela =
  areaLeitor.clientWidth;


  if(larguraHQ > larguraTela){

    areaLeitor.scrollLeft =
    (larguraHQ - larguraTela) / 2;

  }else{

    areaLeitor.scrollLeft = 0;

  }

}


/* MOBILE STAGE */

function atualizarMobileStage(){

  if(!ehMobile()) return;


  const larguraBase =
  leitor.scrollWidth;

  const alturaBase =
  leitor.scrollHeight;


  mobileStage.style.width =
  Math.max(
    areaLeitor.clientWidth,
    larguraBase * mobileScale
  ) + "px";


  mobileStage.style.height =
  Math.max(
    areaLeitor.clientHeight,
    alturaBase * mobileScale
  ) + "px";


  leitor.style.transform =
  `scale(${mobileScale})`;

}


/* ZOOM MOBILE */

function aplicarZoomMobile(
  novaEscala,
  centroX,
  centroY
){

  novaEscala =
  Math.max(
    mobileScaleMin,
    Math.min(
      mobileScaleMax,
      novaEscala
    )
  );


  const escalaAnterior =
  mobileScale;


  const pontoX =
  (
    areaLeitor.scrollLeft +
    centroX
  ) / escalaAnterior;


  const pontoY =
  (
    areaLeitor.scrollTop +
    centroY
  ) / escalaAnterior;


  mobileScale =
  novaEscala;


  atualizarMobileStage();


  let novoScrollX =
  pontoX * mobileScale -
  centroX;


  let novoScrollY =
  pontoY * mobileScale -
  centroY;


  const maxScrollX =
  Math.max(
    0,
    areaLeitor.scrollWidth -
    areaLeitor.clientWidth
  );


  const maxScrollY =
  Math.max(
    0,
    areaLeitor.scrollHeight -
    areaLeitor.clientHeight
  );


  novoScrollX =
  Math.max(
    0,
    Math.min(
      novoScrollX,
      maxScrollX
    )
  );


  novoScrollY =
  Math.max(
    0,
    Math.min(
      novoScrollY,
      maxScrollY
    )
  );


  areaLeitor.scrollLeft =
  novoScrollX;

  areaLeitor.scrollTop =
  novoScrollY;

}


/* PINCH */

let pinchAtivo = false;

let distanciaInicial = 0;

let escalaInicialPinch = 1;


function distanciaEntreDedos(
  touch1,
  touch2
){

  const dx =
  touch2.clientX -
  touch1.clientX;

  const dy =
  touch2.clientY -
  touch1.clientY;

  return Math.sqrt(
    dx * dx +
    dy * dy
  );

}


function centroDosDedos(
  touch1,
  touch2
){

  return {

    x:
      (
        touch1.clientX +
        touch2.clientX
      ) / 2,

    y:
      (
        touch1.clientY +
        touch2.clientY
      ) / 2

  };

}


areaLeitor.addEventListener(
  "touchstart",
  function(event){

    if(!ehMobile()) return;


    if(event.touches.length === 2){

      pinchAtivo = true;

      const t1 =
      event.touches[0];

      const t2 =
      event.touches[1];

      distanciaInicial =
      distanciaEntreDedos(
        t1,
        t2
      );

      escalaInicialPinch =
      mobileScale;

    }

  },
  {
    passive:true
  }
);


areaLeitor.addEventListener(
  "touchmove",
  function(event){

    if(!ehMobile()) return;

    if(
      event.touches.length !== 2 ||
      !pinchAtivo
    ){

      return;

    }


    event.preventDefault();


    const t1 =
    event.touches[0];

    const t2 =
    event.touches[1];


    const distanciaAtual =
    distanciaEntreDedos(
      t1,
      t2
    );


    if(distanciaInicial <= 0)
      return;


    const fator =
    distanciaAtual /
    distanciaInicial;


    const novaEscala =
    escalaInicialPinch *
    fator;


    const centro =
    centroDosDedos(
      t1,
      t2
    );


    const rect =
    areaLeitor.getBoundingClientRect();


    const centroX =
    centro.x -
    rect.left;


    const centroY =
    centro.y -
    rect.top;


    aplicarZoomMobile(
      novaEscala,
      centroX,
      centroY
    );

  },
  {
    passive:false
  }
);


areaLeitor.addEventListener(
  "touchend",
  function(event){

    if(!ehMobile()) return;


    if(event.touches.length < 2){

      pinchAtivo = false;

      distanciaInicial = 0;

    }

  },
  {
    passive:true
  }
);


areaLeitor.addEventListener(
  "touchcancel",
  function(){

    pinchAtivo = false;

    distanciaInicial = 0;

  }
);


/* ZOOM DESKTOP */

async function atualizarZoomDesktop(){

  if(ehMobile()) return;


  const centroX =
  areaLeitor.scrollLeft +
  areaLeitor.clientWidth / 2;


  const centroY =
  areaLeitor.scrollTop +
  areaLeitor.clientHeight / 2;


  const proporcaoX =
  centroX / zoom;


  const proporcaoY =
  centroY / zoom;


  zoom =
  Math.max(
    zoomMinimo,
    Math.min(
      zoomMaximo,
      zoom
    )
  );


  zoomTexto.textContent =
  Math.round(zoom * 100) + "%";


  await renderizarPDF();


  const larguraHQ =
  leitor.scrollWidth;

  const alturaHQ =
  leitor.scrollHeight;


  mobileStage.style.width =
  Math.max(
    areaLeitor.clientWidth,
    larguraHQ
  ) + "px";


  mobileStage.style.height =
  Math.max(
    areaLeitor.clientHeight,
    alturaHQ
  ) + "px";


  const novoCentroX =
  proporcaoX * zoom;


  const novoCentroY =
  proporcaoY * zoom;


  if(
    larguraHQ <=
    areaLeitor.clientWidth
  ){

    areaLeitor.scrollLeft = 0;

  }else{

    areaLeitor.scrollLeft =
    Math.max(
      0,
      Math.min(
        novoCentroX -
        areaLeitor.clientWidth / 2,
        areaLeitor.scrollWidth -
        areaLeitor.clientWidth
      )
    );

  }


  areaLeitor.scrollTop =
  Math.max(
    0,
    Math.min(
      novoCentroY -
      areaLeitor.clientHeight / 2,
      areaLeitor.scrollHeight -
      areaLeitor.clientHeight
    )
  );

}


/* BOTÕES DE ZOOM */

menosZoom.addEventListener(
  "click",
  function(){

    if(ehMobile()) return;

    zoom -= passoZoom;

    atualizarZoomDesktop();

  }
);


maisZoom.addEventListener(
  "click",
  function(){

    if(ehMobile()) return;

    zoom += passoZoom;

    atualizarZoomDesktop();

  }
);


zoom100.addEventListener(
  "click",
  function(){

    if(ehMobile()) return;

    zoom = 1;

    atualizarZoomDesktop();

  }
);


/* DOWNLOAD */

download.addEventListener(
  "click",
  function(){

    if(!urlPDFAtual)
      return;


    if(
      urlPDFAtual.includes(
        "polished-term-e56bmega-leitor-proxy.megahqwix.workers.dev"
      )
    ){

      const urlDownload =
        urlPDFAtual +
        "&download=1";


      window.location.href =
      urlDownload;


      return;

    }


    const link =
    document.createElement("a");

    link.href =
    urlPDFAtual;

    link.download =
    nomeArquivoDownload;

    link.target =
    "_blank";

    document.body.appendChild(link);

    link.click();

    link.remove();

  }
);


/* TELA CHEIA */

fullscreen.addEventListener(
  "click",
  async function(){

    try{

      if(!document.fullscreenElement){

        await document.documentElement.requestFullscreen();

        fullscreen.textContent =
        "✕";

      }else{

        await document.exitFullscreen();

        fullscreen.textContent =
        "⛶";

      }

    }catch(erro){

      console.error(
        "Erro ao abrir tela cheia:",
        erro
      );

    }

  }
);


document.addEventListener(
  "fullscreenchange",
  function(){

    if(document.fullscreenElement){

      fullscreen.textContent =
      "✕";

    }else{

      fullscreen.textContent =
      "⛶";

    }

  }
);


/* ARRASTAR DESKTOP */

let arrastando = false;

let inicioX = 0;

let inicioY = 0;

let scrollInicialX = 0;

let scrollInicialY = 0;


areaLeitor.addEventListener(
  "mousedown",
  function(event){

    if(ehMobile()) return;

    if(zoom <= 1) return;


    arrastando = true;

    inicioX =
    event.clientX;

    inicioY =
    event.clientY;


    scrollInicialX =
    areaLeitor.scrollLeft;

    scrollInicialY =
    areaLeitor.scrollTop;


    areaLeitor.style.cursor =
    "grabbing";

  }
);


window.addEventListener(
  "mousemove",
  function(event){

    if(
      !arrastando ||
      ehMobile()
    ){

      return;

    }


    const deslocamentoX =
    event.clientX -
    inicioX;


    const deslocamentoY =
    event.clientY -
    inicioY;


    areaLeitor.scrollLeft =
    scrollInicialX -
    deslocamentoX;


    areaLeitor.scrollTop =
    scrollInicialY -
    deslocamentoY;

  }
);


window.addEventListener(
  "mouseup",
  function(){

    if(!arrastando)
      return;


    arrastando = false;

    areaLeitor.style.cursor =
    "default";

  }
);


/* REDIMENSIONAMENTO */

let resizeTimer = null;


window.addEventListener(
  "resize",
  function(){

    clearTimeout(
      resizeTimer
    );


    resizeTimer =
    setTimeout(
      function(){

        renderizarPDF();

      },
      250
    );

  }
);


/* CARREGAR PDF */

async function carregarPDF(){

  const parametros =
  new URLSearchParams(
    window.location.search
  );


  const id =
  parametros.get("id");


  const arquivo =
  parametros.get("pdf");


  if(id){

    urlPDFAtual =
      "https://polished-term-e56bmega-leitor-proxy.megahqwix.workers.dev/?id=" +
      encodeURIComponent(id);


    nomeArquivoDownload =
      "MegaHQ-" +
      id +
      ".pdf";

  }


  else if(arquivo){

    urlPDFAtual =
      arquivo;


    const nomeOriginal =
      arquivo
        .split("/")
        .pop()
        .split("?")[0];


    nomeArquivoDownload =
      nomeOriginal ||
      "MegaHQ.pdf";

  }


  else{

    urlPDFAtual =
      "UBS CIDADE LUZ PREVIAS.pdf";


    nomeArquivoDownload =
      "UBS CIDADE LUZ PREVIAS.pdf";

  }


  download.disabled = false;


  try{

    pdf =
      await pdfjsLib
      .getDocument(
        urlPDFAtual
      )
      .promise;


    await renderizarPDF();


  }catch(erro){

    console.error(
      "Erro ao carregar PDF:",
      erro
    );


    download.disabled = true;


    leitor.innerHTML = "";


    const mensagem =
    document.createElement(
      "div"
    );


    mensagem.style.color =
    "white";


    mensagem.style.padding =
    "30px";


    mensagem.style.fontSize =
    "18px";


    mensagem.textContent =
    "Não foi possível carregar o PDF.";


    leitor.appendChild(
      mensagem
    );

  }

}


/* INICIAR */

carregarPDF();

</script>
