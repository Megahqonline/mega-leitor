<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MegaHQ Online - Leitor</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #111;
            font-family: Arial, sans-serif;
        }

        body {
            overflow: hidden;
        }


        /* =========================
           BARRA DE CONTROLES
           ========================= */

        #barra {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 55px;

            background: #181818;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 8px;

            z-index: 1000;

            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }


        #barra button {

            background: #292929;

            color: white;

            border: 1px solid #444;

            border-radius: 5px;

            padding: 7px 12px;

            font-size: 14px;

            cursor: pointer;

        }


        #barra button:hover {

            background: #3a3a3a;

        }


        #zoomTexto {

            color: white;

            min-width: 55px;

            text-align: center;

            font-size: 14px;

        }


        #paginaTexto {

            color: white;

            min-width: 90px;

            text-align: center;

            font-size: 14px;

        }


        /* =========================
           CARREGANDO
           ========================= */

        #carregando {

            position: fixed;

            top: 55px;
            left: 0;
            right: 0;
            bottom: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            color: white;

            font-size: 18px;

            z-index: 500;

        }


        /* =========================
           ÁREA DO LEITOR
           ========================= */

        #areaLeitor {

            position: fixed;

            top: 55px;
            left: 0;
            right: 0;
            bottom: 0;

            overflow: auto;

        }


        #leitor {

            width: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 10px;

            padding: 20px;

        }


        /* =========================
           PÁGINAS
           ========================= */

        .pagina {

            display: block;

            height: auto;

            box-shadow:
                0 0 10px rgba(0,0,0,0.6);

            background: white;

        }


        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 600px) {

            #barra {

                height: 50px;

                gap: 4px;

            }

            #barra button {

                padding: 6px 8px;

                font-size: 13px;

            }

            #zoomTexto {

                min-width: 45px;

                font-size: 12px;

            }

            #paginaTexto {

                min-width: 70px;

                font-size: 12px;

            }

            #areaLeitor {

                top: 50px;

            }

            #leitor {

                padding: 10px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================
         BARRA
         ========================= -->

    <div id="barra">

        <button id="zoomMenos">
            −
        </button>

        <span id="zoomTexto">
            100%
        </span>

        <button id="zoomMais">
            +
        </button>

        <button id="zoomReset">
            100%
        </button>

        <span id="paginaTexto">
            Página 1
        </span>

        <button id="telaCheia">
            ⛶
        </button>

    </div>


    <!-- =========================
         CARREGANDO
         ========================= -->

    <div id="carregando">
        Carregando HQ...
    </div>


    <!-- =========================
         ÁREA DO LEITOR
         ========================= -->

    <div id="areaLeitor">

        <div id="leitor"></div>

    </div>


    <script type="module">


        /* =====================================================
           PDF.JS
           ===================================================== */

        import * as pdfjsLib from
        "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.mjs";


        pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.mjs";


        /* =====================================================
           PDF
           ===================================================== */

        const pdfUrl =
        "./UBS%20CIDADE%20LUZ%20PREVIAS.pdf";


        /* =====================================================
           ELEMENTOS
           ===================================================== */

        const leitor =
        document.getElementById("leitor");


        const areaLeitor =
        document.getElementById("areaLeitor");


        const carregando =
        document.getElementById("carregando");


        const zoomTexto =
        document.getElementById("zoomTexto");


        const paginaTexto =
        document.getElementById("paginaTexto");


        const zoomMais =
        document.getElementById("zoomMais");


        const zoomMenos =
        document.getElementById("zoomMenos");


        const zoomReset =
        document.getElementById("zoomReset");


        const telaCheia =
        document.getElementById("telaCheia");


        /* =====================================================
           VARIÁVEIS
           ===================================================== */

        let pdf = null;

        let zoom = 1;

        let paginaAtual = 1;

        let paginas = [];


        const zoomMinimo = 0.5;

        const zoomMaximo = 3;

        const passoZoom = 0.25;


        /* =====================================================
           CARREGAR PDF
           ===================================================== */

        async function carregarPDF() {

            try {

                /*
                 * Mantemos exatamente o mesmo carregamento
                 * que já estava funcionando.
                 */

                pdf =
                await pdfjsLib
                .getDocument(pdfUrl)
                .promise;


                carregando.style.display =
                "none";


                /*
                 * Primeiro carregamento.
                 */

                await renderizarPDF();


                atualizarPagina();

            }

            catch (erro) {

                console.error(
                    "Erro PDF:",
                    erro
                );

                carregando.innerText =
                "Erro ao carregar o PDF.";

            }

        }


        /* =====================================================
           RENDERIZAR PDF
           ===================================================== */

        async function renderizarPDF() {

            leitor.innerHTML = "";

            paginas = [];


            /*
             * Usamos o pixelRatio da tela para
             * melhorar a nitidez.
             */

            const pixelRatio =
            window.devicePixelRatio || 1;


            for (
                let numero = 1;
                numero <= pdf.numPages;
                numero++
            ) {

                const pagina =
                await pdf.getPage(numero);


                /*
                 * Escala da página.

                 * zoom = 1 → tamanho normal
                 * zoom = 2 → dobro
                 * zoom = 3 → triplo
                 */

                const escala =
                1.5 * zoom * pixelRatio;


                const viewport =
                pagina.getViewport({
                    scale: escala
                });


                const canvas =
                document.createElement("canvas");


                canvas.className =
                "pagina";


                const contexto =
                canvas.getContext(
                    "2d"
                );


                /*
                 * Resolução interna do canvas.
                 */

                canvas.width =
                viewport.width;


                canvas.height =
                viewport.height;


                /*
                 * Tamanho visual.

                 * Isso impede que o canvas fique
                 * maior que a tela quando o zoom
                 * estiver em 100%.
                 */

                canvas.style.width =
                (viewport.width / pixelRatio)
                + "px";


                canvas.style.height =
                (viewport.height / pixelRatio)
                + "px";


                leitor.appendChild(
                    canvas
                );


                await pagina.render({

                    canvasContext:
                    contexto,

                    viewport:
                    viewport

                }).promise;


                paginas.push(canvas);

            }

        }


        /* =====================================================
           ATUALIZAR ZOOM
           ===================================================== */

        async function alterarZoom(novoZoom) {

            if (
                novoZoom <
                zoomMinimo
            ) {

                novoZoom =
                zoomMinimo;

            }


            if (
                novoZoom >
                zoomMaximo
            ) {

                novoZoom =
                zoomMaximo;

            }


            zoom =
            novoZoom;


            const paginaSalva =
            paginaAtual;


            /*
             * Mantém a página atual
             * durante o novo render.
             */

            carregando.style.display =
            "flex";


            carregando.innerText =
            "Ajustando zoom...";


            await renderizarPDF();


            carregando.style.display =
            "none";


            atualizarZoomTexto();


            /*
             * Volta para a página
             * que estava sendo visualizada.
             */

            setTimeout(
                function() {

                    if (
                        paginas[
                            paginaSalva - 1
                        ]
                    ) {

                        paginas[
                            paginaSalva - 1
                        ].scrollIntoView({
                            behavior: "instant",
                            block: "start"
                        });

                    }

                },
                50
            );

        }


        /* =====================================================
           TEXTO DO ZOOM
           ===================================================== */

        function atualizarZoomTexto() {

            zoomTexto.innerText =
            Math.round(
                zoom * 100
            ) + "%";

        }


        /* =====================================================
           ZOOM +
           ===================================================== */

        zoomMais.addEventListener(
            "click",
            function() {

                alterarZoom(
                    zoom + passoZoom
                );

            }
        );


        /* =====================================================
           ZOOM -
           ===================================================== */

        zoomMenos.addEventListener(
            "click",
            function() {

                alterarZoom(
                    zoom - passoZoom
                );

            }
        );


        /* =====================================================
           RESET
           ===================================================== */

        zoomReset.addEventListener(
            "click",
            function() {

                alterarZoom(1);

            }
        );


        /* =====================================================
           TELA CHEIA
           ===================================================== */

        telaCheia.addEventListener(
            "click",
            async function() {

                try {

                    if (
                        !document.fullscreenElement
                    ) {

                        await document
                        .documentElement
                        .requestFullscreen();

                    }

                    else {

                        await document
                        .exitFullscreen();

                    }

                }

                catch (erro) {

                    console.error(
                        erro
                    );

                }

            }
        );


        /* =====================================================
           DETECTAR PÁGINA ATUAL
           ===================================================== */

        areaLeitor.addEventListener(
            "scroll",
            function() {

                if (
                    paginas.length === 0
                )
                    return;


                let paginaMaisProxima =
                1;


                let menorDistancia =
                Infinity;


                paginas.forEach(
                    function(
                        canvas,
                        indice
                    ) {

                        const distancia =
                        Math.abs(
                            canvas.offsetTop -
                            areaLeitor.scrollTop
                        );


                        if (
                            distancia <
                            menorDistancia
                        ) {

                            menorDistancia =
                            distancia;


                            paginaMaisProxima =
                            indice + 1;

                        }

                    }
                );


                paginaAtual =
                paginaMaisProxima;


                atualizarPagina();

            }
        );


        /* =====================================================
           TEXTO DA PÁGINA
           ===================================================== */

        function atualizarPagina() {

            if (!pdf)
                return;


            paginaTexto.innerText =
            "Página " +
            paginaAtual +
            " / " +
            pdf.numPages;

        }


        /* =====================================================
           ZOOM COM CTRL + RODA DO MOUSE
           ===================================================== */

        areaLeitor.addEventListener(
            "wheel",
            function(event) {

                if (
                    !event.ctrlKey
                )
                    return;


                event.preventDefault();


                if (
                    event.deltaY < 0
                ) {

                    alterarZoom(
                        zoom + passoZoom
                    );

                }

                else {

                    alterarZoom(
                        zoom - passoZoom
                    );

                }

            },
            {
                passive: false
            }
        );


        /* =====================================================
           TECLADO
           ===================================================== */

        document.addEventListener(
            "keydown",
            function(event) {

                /*
                 * + = aumentar
                 */

                if (
                    event.key === "+"
                ) {

                    alterarZoom(
                        zoom + passoZoom
                    );

                }


                /*
                 * - = diminuir
                 */

                if (
                    event.key === "-"
                ) {

                    alterarZoom(
                        zoom - passoZoom
                    );

                }


                /*
                 * 0 = voltar para 100%
                 */

                if (
                    event.key === "0"
                ) {

                    alterarZoom(1);

                }

            }
        );


        /* =====================================================
           INICIAR
           ===================================================== */

        carregarPDF();

    </script>

</body>

</html>
